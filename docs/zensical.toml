[project]
site_name = "Hskify"
site_description = "Direct progressive HSK manga translation for Firefox."
site_author = "Hskify contributors"
docs_dir = "."
site_dir = "site"
nav = [
  {"Documentation" = "README.md"},
  {"Architecture" = "architecture.md"},
  {"Browser contract" = "browser-contract.md"},
  {"Chapter 5 benchmark" = "chapter-5-benchmark.md"},
  {"Model record" = "model-benchmark.md"},
  {"Firefox checklist" = "firefox-manual-test-checklist.md"},
  {"Maintainer guide" = "maintainer-guide.md"},
  {"Licence inventory" = "licence-inventory.md"},
]

[project.extra]
generator = false

[project.theme]
language = "en"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "navigation.sections",
  "navigation.instant",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "cyan"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"

[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
