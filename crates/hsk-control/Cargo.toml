[package]
name = "hsk-control"
version.workspace = true
edition.workspace = true
description = "Deterministic HSK 2.0 vocabulary control and local Chinese dictionary lookup"
license.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
publish.workspace = true

[features]
default = []
test-seeds = []

[dependencies]
csv = { workspace = true }
# Segmentation output is part of the validation/cache contract. Keep the exact
# release and its default embedded dictionary feature pinned together.
jieba-rs = { version = "=0.10.1", features = ["default-dict"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
unicode-normalization = "=0.1.25"

# Pure Rust, bundled OpenCC-compatible lexicons. Keep this exact because its
# dictionaries are part of the normalization/cache revision.
opencc-fmmseg = "=0.8.0"

[dev-dependencies]
tempfile = { workspace = true }
