[package]
name = "browser-companion"
version.workspace = true
edition.workspace = true
description = "Authenticated Firefox browser adapter for Koharu"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
camino = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
fs4 = { workspace = true }
getrandom = "0.3"
http-body = "1"
image = { workspace = true }
hsk-control = { path = "../hsk-control" }
koharu-app = { workspace = true }
koharu-core = { workspace = true }
koharu-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
subtle = "2.6"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[bin]]
name = "hsk-manga-native-host"
path = "src/bin/hsk-manga-native-host.rs"

[[bin]]
name = "hsk-manga-browser-daemon"
path = "src/bin/hsk-manga-browser-daemon.rs"
