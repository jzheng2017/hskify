<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manga layout fixture</title>
    <link rel="stylesheet" href="./fixture.css" />
  </head>
  <body>
    <header><h1>Fixed, max-width, contain, cover, and rejected transform</h1></header>
    <main class="reader">
      <img class="manga fixed" src="../images/synthetic-panel-a.png" alt="Fixed width manga" />
      <div class="fit-frame">
        <img class="contain" src="../images/synthetic-panel-wide.png" alt="Contained manga" />
      </div>
      <div class="fit-frame">
        <img class="fit-cover" src="../images/synthetic-panel-wide.png" alt="Covered manga" />
      </div>
      <img class="manga rotated" src="../images/synthetic-panel-b.png" alt="Safely rejected rotated manga" />
    </main>
  </body>
</html>
