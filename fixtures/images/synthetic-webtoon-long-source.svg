  <g fill="#111827" font-family="Arial, sans-serif" font-size="56" font-weight="700" text-anchor="middle">
    <text x="430" y="525"><tspan x="430">WE HAVE TO</tspan><tspan x="430" dy="70">KEEP MOVING!</tspan></text>
    <text x="505" y="2425"><tspan x="505">THE RAIN</tspan><tspan x="505" dy="70">IS GETTING WORSE.</tspan></text>
    <text x="445" y="4635"><tspan x="445">LOOK—</tspan><tspan x="445" dy="70">MORNING!</tspan></text>
    <text x="500" y="6435"><tspan x="500">STAY CLOSE</tspan><tspan x="500" dy="70">TO ME.</tspan></text>
    <text x="440" y="8385"><tspan x="440">I CAN SEE</tspan><tspan x="440" dy="70">THE RIDGE.</tspan></text>
    <text x="505" y="10305"><tspan x="505">JUST ONE</tspan><tspan x="505" dy="70">MORE HILL.</tspan></text>
    <text x="445" y="12405"><tspan x="445">DON'T STOP</tspan><tspan x="445" dy="70">NOW!</tspan></text>
    <text x="495" y="14535"><tspan x="495">WE MADE IT</tspan><tspan x="495" dy="70">TO THE RIVER.</tspan></text>
  </g>
  <text x="860" y="15940" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="24" text-anchor="end">SYNTHETIC LONG WEBTOON FIXTURE · CC0</text>
