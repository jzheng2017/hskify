<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16000" viewBox="0 0 900 16000" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic long vertical webtoon test page</title>
  <desc id="desc">Original CC0-style geometric artwork made for responsive discovery and scrolling tests.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset=".55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset=".5" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <pattern id="rain" width="80" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M10 0v70M50 35v70" stroke="#bfdbfe" stroke-width="8" opacity=".28"/>
    </pattern>
    <filter id="soft"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".28"/></filter>
  </defs>
  <rect width="900" height="16000" fill="#0f172a"/>
  <rect width="900" height="2100" fill="url(#night)"/>
