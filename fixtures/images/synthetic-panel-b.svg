<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic colour webtoon panel</title>
  <desc id="desc">A tall colour fixture with irregular and vertical bubbles.</desc>
  <defs>
    <linearGradient id="sunset" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7b267"/>
      <stop offset=".52" stop-color="#f4845f"/>
      <stop offset="1" stop-color="#6f5aa8"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="14" dy="18" stdDeviation="9" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="1800" fill="url(#sunset)"/>
  <circle cx="225" cy="260" r="145" fill="#ffe6a7" opacity=".8"/>
  <path d="M0 1280 250 960 430 1180 650 790 910 1120 1200 900V1800H0Z" fill="#263159"/>
  <path d="M0 1450q225-210 450 0t450 0 300 0v350H0Z" fill="#14213d"/>
  <path d="M120 305q70-160 240-98 70-120 205-30 160-5 175 145 105 74 20 188-28 140-210 111-115 92-223-22-185 23-187-138-90-70-20-156Z" fill="#fff8ea" stroke="#3b3157" stroke-width="12" filter="url(#shadow)"/>
  <text x="425" y="350" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="60" font-weight="700" fill="#3b3157">
    <tspan x="425" dy="0">WE HAVE TO</tspan>
    <tspan x="425" dy="72">LEAVE NOW!</tspan>
  </text>
  <rect x="780" y="620" width="250" height="610" rx="125" fill="#fff" stroke="#2f2a45" stroke-width="12"/>
  <text x="905" y="750" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#2f2a45" writing-mode="tb">
    WAIT FOR ME!
  </text>
  <path d="M275 1320q110-210 250-25 170-155 272 80 150 22 94 173-12 145-185 126-133 124-253-18-150 65-220-69-120-105 42-267Z" fill="#fff2c6" stroke="#663c56" stroke-width="12"/>
  <text x="560" y="1445" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="56" font-weight="800" fill="#663c56">DON'T STOP!</text>
  <text x="1155" y="1750" text-anchor="end" font-family="Arial, sans-serif" font-size="28" fill="#fff">SYNTHETIC FIXTURE · CC0</text>
</svg>
