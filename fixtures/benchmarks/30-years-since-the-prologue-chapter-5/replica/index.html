    <script>
      const images = [...document.querySelectorAll('#chapter > img')]
      const startedAt = performance.now()
      window.__hskifyBenchmark = {
        ready: false,
        error: null,
        decodedAtMs: null,
        decodeDurationMs: null,
        dimensions: [],
      }
      Promise.all(images.map((image) => image.decode()))
        .then(() => {
          window.__hskifyBenchmark.ready = true
          window.__hskifyBenchmark.decodedAtMs = performance.now()
          window.__hskifyBenchmark.decodeDurationMs =
            window.__hskifyBenchmark.decodedAtMs - startedAt
          window.__hskifyBenchmark.dimensions = images.map((image) => ({
            page: Number(image.dataset.page),
            width: image.naturalWidth,
            height: image.naturalHeight,
          }))
          document.documentElement.dataset.benchmarkReady = 'true'
        })
        .catch((error) => {
          window.__hskifyBenchmark.error =
            error instanceof Error ? error.message : String(error)
          document.documentElement.dataset.benchmarkReady = 'error'
        })
    </script>
